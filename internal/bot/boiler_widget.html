<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
:root{color-scheme:light dark;--fg:var(--tg-theme-text-color,#222);--muted:var(--tg-theme-hint-color,#777);--card:var(--tg-theme-secondary-bg-color,#f3f3f3);--accent:var(--tg-theme-button-color,#3984e5)}
*{box-sizing:border-box}body{margin:0;padding:12px;font:15px/1.4 system-ui,sans-serif;color:var(--fg);background:transparent}
.card{padding:14px;border-radius:14px;background:var(--card)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.title{font-size:16px;font-weight:650}.status{color:var(--muted);font-size:13px}
.values{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{min-width:0}.label{display:block;color:var(--muted);font-size:12px}.value{display:block;overflow-wrap:anywhere;font-weight:600;margin-top:2px}button{margin-top:13px;border:0;border-radius:9px;padding:8px 12px;background:var(--accent);color:var(--tg-theme-button-text-color,#fff);font:inherit;font-size:13px;font-weight:600}button:disabled{opacity:.55}.error{margin-top:9px;color:var(--tg-theme-destructive-text-color,#d14b4b);font-size:12px}
</style>
</head>
<body>
<section class="card">
<div class="head"><span class="title">Котёл</span><span class="status" id="status">Нет данных</span></div>
<div class="values">
  <div class="item"><span class="label">Температура подачи</span><span class="value" id="temperature">-</span></div>
  <div class="item"><span class="label">Обновлено</span><span class="value" id="updated">-</span></div>
</div>
<button id="refresh" type="button">Обновить</button>
<div class="error" id="error" hidden></div>
</section>
<script>
(() => {
  const widget = window.TelegramWidget;
  const temperature = document.getElementById('temperature');
  const status = document.getElementById('status');
  const updated = document.getElementById('updated');
  const error = document.getElementById('error');
  const button = document.getElementById('refresh');

  function showError(message) {
    error.textContent = message;
    error.hidden = false;
  }

  function showReadings(data) {
    temperature.textContent = data.temperature;
    status.textContent = data.status;
    updated.textContent = data.updated_at;
    error.hidden = true;
  }

  function updateChatData() {
    if (!widget.chatData) {
      return;
    }

    try {
      showReadings(JSON.parse(widget.chatData));
    } catch {
      showError('Не удалось прочитать показания');
    }
  }

  updateChatData();
  widget.onEvent('chatDataChanged', updateChatData);

  button.addEventListener('click', async () => {
    button.disabled = true;
    error.hidden = true;

    try {
      const answer = await widget.request('refresh');
      const data = JSON.parse(answer.result);
      if (!data || data.error) {
        showError(data?.error || 'Нет ответа');
      } else {
        showReadings(data);
      }
    } catch {
      showError('Не удалось обновить данные');
    } finally {
      button.disabled = false;
    }
  });

  widget.ready();
})();
</script>
</body>
</html>
